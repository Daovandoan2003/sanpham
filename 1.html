<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>duan1</title>
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <div class="card__heart">
        <i class="bx bxs-heart"></i>
      </div>
      <div class="card__cart">
        <i class="bx bx-cart-download"></i>
      </div>
      <div class="card__img">
        <img src="/photo-1-15706463929181755249740.jpg" alt="" />
      </div>
      <div class="card__title">Điện thoại iphone16</div>
      <div class="card__price">16.000.000VND</div>
      <div class="card__size">
        <h3>dung lượng</h3>
        <span>16g</span>
        <span>32g</span>
        <span>64g</span>
        <span>128g</span>
      </div>
      <div class="card__color">
        <h3>màu sắc:</h3>
        <span class="class__color--black"></span>
        <span class="class__color--white"></span>
        <span class="class__color--green"></span>
      </div>

      <div class="card__action">
        <button>Mua Ngay</button>
        <button>Thêm Giỏ Hàng</button>
      </div>
    </div>
    <div class="pc">
      <div class="pc__heart"><i class="bx bxs-heart"></i></div>
      <div class="pc__cart"><i class="bx bx-cart-download"></i></div>
      <div class="pc__img">
        <img src="/asus-aio-a3402wvak-i3-wpc080w-thumb-49-600x600.jpg" alt="" />
      </div>
      <div class="pc__title">Computer</div>
      <div class="pc__price">30.000.000VND</div>
      <div class="pc__size">
        <h3>kích cỡ</h3>
        <span>1core</span>
        <span>2core</span>
        <span>4core</span>
        <span>8core</span>
      </div>
      <div class="pc__color">
        <h3>Màu sắc</h3>
        <span class="class__color--vang"></span>
        <span class="class__color--hong"></span>
        <span class="class__color--tim"></span>
      </div>
      <div class="pc__action">
        <button>Mua ngay</button>
        <button>Thêm Giỏ Hàng</button>
      </div>
    </div>
    <div class="ao">
      <div class="ao__heart">
        <i class="bx bx-heart"></i>
      </div>
      <div class="ao__cart">
        <i class="bx bx-cart-download"></i>
      </div>
      <div class="ao__img">
        <img
          src="/artboard_3_d5038c5e43b84261aff692eed6748dde_large.webp"
          alt=""
        />
      </div>
      <div class="ao__title">Áo Phông Nam Nữ</div>
      <div class="ao__price">
        <h3>Giá</h3>

        <span class="Gia">100k</span>
        <span class="Gia">200k</span>
        <span class="Gia">400k</span>
        <span class="Gia">500k</span>
      </div>
      <div class="ao__size">
        <h3>Kích Cỡ</h3>
        <span>S</span>
        <span>M</span>
        <span>L</span>
        <span>XL</span>
      </div>
      <div class="ao__color">
        <h3>Màu Sắc</h3>
        <span class="den"></span>
        <span class="trang"></span>
        <span class="xanh"></span>
        <span class="do"></span>
      </div>
      <div class="ao__action">
        <button>Mua Ngay</button>
        <button>Thêm Giỏ Hàng</button>
      </div>
    </div>
  </body>
</html>
